<html lang="uk">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@1,500&display=swap">
<style>
  /* One centered scene on a linen-and-petals ground; single warm light look */
  :root {
    --ground: #efe4d8;
    --ink: #5a1f2b;
    --ink-soft: #8a5a60;
    --wax: #6e1a26;
    --note: "Caveat", "Segoe Script", "Bradley Hand", cursive;
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    background: var(--ground) url("assets/bg.webp") center / cover no-repeat fixed;
    color: var(--ink);
    font-family: var(--serif);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .stage {
    height: 100%;
    display: grid;
    place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px;
    box-sizing: border-box;
  }
  .wrap {
    display: grid;
    justify-items: center;
    gap: 4px;
    width: min(92vw, 560px);
  }
  .label {
    font-family: var(--note);
    font-weight: 700;
    font-size: clamp(34px, 9vw, 52px);
    color: var(--ink);
    margin: 0;
    animation: bob 2.6s ease-in-out infinite;
    transition: opacity .4s ease, transform .4s ease;
  }
  .opened .label { opacity: 0; transform: translateY(-8px); animation: none; }

  .env {
    position: relative;
    width: 100%;
    max-width: 100%;
    aspect-ratio: 1;
    border: 0;
    padding: 0;
    background: none;
    cursor: pointer;
    filter: drop-shadow(0 18px 24px rgba(90, 31, 43, .18));
  }
  .env:focus-visible { outline: 2px dashed var(--ink-soft); outline-offset: 6px; border-radius: 12px; }
  .env img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }
  .closed-img { transition: opacity .5s ease .35s, transform .9s cubic-bezier(.3,1.4,.5,1); }
  .open-img { opacity: 0; transform: scale(.96); transition: opacity .6s ease .35s, transform .9s cubic-bezier(.3,1.3,.5,1) .3s; }
  .env:not(.is-open):hover .closed-img { transform: scale(1.02) rotate(-1deg); }
  .env.shake .closed-img { animation: shake .4s ease; }
  .is-open .closed-img { opacity: 0; transform: scale(1.04); }
  .is-open .open-img { opacity: 1; transform: scale(1); }
  .is-open { cursor: default; }
  .env { transition: transform 1.4s cubic-bezier(.2,.9,.3,1) .4s; }
  .env.is-open { transform: scale(1.07) translateY(-2%); }

  /* soft pulsing glow on the wax seal: "tap here" */
  .glow {
    position: absolute; left: 50%; top: 57.5%;
    width: 22%; aspect-ratio: 1; max-width: 100%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 200, 208, .38), rgba(255, 200, 208, 0) 70%);
    mix-blend-mode: screen;
    animation: pulse 1.8s ease-in-out infinite;
    pointer-events: none;
    transition: opacity .3s ease;
  }
  .is-open .glow { opacity: 0; animation: none; }

  .sound {
    position: fixed; z-index: 6;
    top: calc(14px + env(safe-area-inset-top, 0px));
    right: calc(14px + env(safe-area-inset-right, 0px));
    width: 44px; height: 44px; border-radius: 50%;
    border: 1.5px solid var(--wax); background: rgba(255, 248, 242, .7);
    color: var(--wax); font-size: 22px; line-height: 1; cursor: pointer;
    display: grid; place-items: center;
    opacity: 0; transform: scale(.8); pointer-events: none;
    transition: opacity .5s ease 1s, transform .5s ease 1s;
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  }
  .sound.show { opacity: 1; transform: none; pointer-events: auto; }
  .sound.off { text-decoration: line-through; opacity: .55; }
  .sound:focus-visible { outline: 2px solid var(--ink-soft); outline-offset: 3px; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 8; }
  .flash {
    position: fixed; inset: 0; pointer-events: none; z-index: 4;
    background: radial-gradient(circle at var(--fx-x, 50%) var(--fx-y, 50%), rgba(255, 236, 230, .9), rgba(255, 236, 230, 0) 45%);
    opacity: 0;
  }
  .flash.go { animation: flash 1.1s ease-out; }
  @keyframes pulse { 0%,100% { transform: translate(-50%,-50%) scale(.85); opacity: .5; } 50% { transform: translate(-50%,-50%) scale(1.15); opacity: 1; } }
  @keyframes flash { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; } }

  /* text sits on the white card; card is tilted like the envelope */
  .note {
    position: absolute;
    left: 44.6%; top: 31%;
    width: 46%; height: 24%;
    transform: translate(-50%, -50%) rotate(-6.5deg);
    display: grid; place-items: center;
    text-align: center;
    font-family: var(--note);
    font-weight: 500;
    font-size: clamp(19px, 5.4vw, 32px);
    line-height: 1.15;
    color: var(--ink);
    text-wrap: balance;
    pointer-events: none;
  }
  .note .w { display: inline-block; white-space: nowrap; }
  .note p { position: relative; margin: 0; }
  /* each letter is revealed left-to-right, like a pen stroke */
  .note .c { display: inline-block; clip-path: inset(-30% 100% -30% -10%); color: #3d0f19; }
  .is-open .note .c { animation: write var(--d, .1s) linear forwards, dry 1.6s ease forwards; }
  @keyframes write { to { clip-path: inset(-30% -10% -30% -10%); } }
  @keyframes dry { from { color: #3d0f19; } to { color: var(--ink); } }
  .pen {
    position: absolute; left: 0; top: 0; width: 30px; height: 30px;
    margin: -28px 0 0 -2px; /* nib tip sits on the point */
    pointer-events: none; opacity: 0;
    transition: left var(--pd, .1s) linear, top .12s ease, opacity .3s ease;
    filter: drop-shadow(1px 2px 1px rgba(60, 15, 25, .25));
  }
  .pen.on { opacity: 1; }
  .doodle { width: 34px; height: 30px; margin: 2px auto 0; display: block; overflow: visible; }
  .doodle path { fill: none; stroke: var(--wax); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 100; stroke-dashoffset: 100; }
  .written .doodle path { animation: draw 1.1s ease forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .stage.enter .env { animation: drop 1.1s cubic-bezier(.2,1.2,.4,1) both; }
  .stage.enter .label { animation: rise .9s ease .5s both, bob 2.6s ease-in-out 1.4s infinite; }
  @keyframes drop { from { opacity: 0; transform: translateY(-40px) rotate(-6deg) scale(.9); } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }

  .intro {
    position: fixed; inset: 0; z-index: 7;
    display: grid; place-items: center;
    padding-left: max(24px, env(safe-area-inset-left, 0px));
    padding-right: max(24px, env(safe-area-inset-right, 0px));
    padding-block: 24px;
    background: var(--ground) url("assets/bg.webp") center / cover no-repeat;
    transition: opacity 1s ease, visibility 0s linear 1s;
    cursor: pointer;
  }
  .intro.out { opacity: 0; visibility: hidden; }
  .poem { display: grid; gap: 10px; text-align: center; max-width: 38ch; }
  .poem p {
    margin: 0; font-family: var(--serif); font-style: italic; font-weight: 500;
    font-size: clamp(20px, 5.4vw, 32px); line-height: 1.25; color: var(--ink);
    text-wrap: balance;
    opacity: 0; transform: translateY(12px); filter: blur(6px);
  }
  .poem p.last { font-family: var(--note); font-style: normal; font-weight: 700; font-size: clamp(30px, 8.4vw, 44px); color: var(--wax); margin-top: 8px; }
  .intro.play .poem p { animation: verse 1.4s ease forwards; }
  .intro.play .poem p:nth-child(2) { animation-delay: 1.4s; }
  .intro.play .poem p:nth-child(3) { animation-delay: 2.8s; }
  .intro.play .poem p:nth-child(4) { animation-delay: 4.2s; }
  @keyframes verse { to { opacity: 1; transform: none; filter: none; } }
  .skip { position: absolute; left: 0; right: 0; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); text-align: center; font-family: var(--serif); font-style: italic; font-size: 16px; color: var(--ink-soft); opacity: .7; margin: 0; }

  .after {
    display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap;
    min-height: 44px;
    opacity: 0; transform: translateY(6px);
    transition: opacity .5s ease, transform .5s ease;
    pointer-events: none;
  }
  .written .after { opacity: 1; transform: none; pointer-events: auto; transition-delay: .6s; }
  .hint { font-style: italic; font-size: 18px; color: var(--ink-soft); margin: 0; }
  .again {
    font-family: var(--note); font-weight: 700; font-size: 22px;
    color: var(--wax); background: none;
    border: 1.5px solid var(--wax); border-radius: 999px;
    padding: 4px 18px; cursor: pointer;
  }
  .again:focus-visible { outline: 2px solid var(--ink-soft); outline-offset: 3px; }

  @keyframes bob { 50% { transform: translateY(-6px); } }
  @keyframes shake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-3deg); } 60% { transform: rotate(3deg); } }
  @keyframes ink { to { opacity: 1; transform: none; filter: none; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  }
</style>

</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="flash" id="flash" aria-hidden="true"></div>
<audio id="music" src="assets/track.mp3" loop preload="auto"></audio>
<button class="sound" id="sound" type="button" aria-label="Вимкнути музику">&#9834;</button>
<div class="intro" id="intro" role="dialog" aria-label="Вірш">
  <div class="poem">
    <p>Хай кілометри між нами і тиша,</p>
    <p>хай сказано зайве — пробач.</p>
    <p>Серце моє тобі знову пише:</p>
    <p class="last">відкрий, прочитай і не плач</p>
  </div>
  <p class="skip">торкнись, щоб продовжити</p>
</div>
<main class="stage" id="stage">
  <div class="wrap">
    <p class="label" aria-hidden="true">відкрий мене</p>
    <button class="env" id="env" type="button" aria-label="Відкрий мене">
      <img class="closed-img" src="assets/closed.webp" alt="">
      <span class="glow" id="glow"></span>
      <img class="open-img" src="assets/open.webp" alt="">
      <div class="note" id="note" aria-live="polite"></div>
    </button>
    <div class="after">
      <p class="hint">онови сторінку — буде нове</p>
      <button class="again" id="again" type="button">ще одне</button>
    </div>
  </div>
</main>

<script>
  const PHRASES = [
    "Дуже чекаю нашої наступної зустрічі",
    "Я тебе дуже кохаю",
    "Рахую дні до того, як знову тебе обійму",
    "Ти найкраще, що зі мною сталося",
    "Сумую за твоїм голосом поруч",
    "Між нами кілометри, а ти все одно найближча",
    "Кожен ранок починається з думки про тебе",
    "Скоро обійму тебе і довго не відпущу",
    "Ти мій дім, де б ти не була",
    "Хочу прокидатися поруч із тобою",
    "Ти робиш мене щасливим",
    "Пишаюся тобою",
    "Мені з тобою спокійно і тепло",
    "Сьогодні я знову закохався в тебе",
    "Обіймаю тебе подумки міцно-міцно",
    "Ти моє улюблене «добраніч»",
    "Мрію про нашу наступну каву разом",
    "Дякую, що ти є",
    "З тобою навіть відстань не страшна",
    "Ти моя людина",
    "Цілую тебе, де б ти зараз не була",
    "Усміхнись, я думаю про тебе",
    "Не можу дочекатися, коли візьму тебе за руку",
    "Ти найгарніша на світі",
    "Люблю тебе більше, ніж учора",
    "Я поруч, навіть коли далеко",
    "Ти моя найтепліша думка за день",
    "Наша зустріч вже ближче, ніж учора",
    "Кохаю тебе до неба і назад",
    "Ти варта всіх кілометрів між нами"
  ];

  // after the quarrel: shown on the very first opening and in ~40% of the rest
  const SORRY = [
    "Пробач мене, кохана",
    "Вибач. Ти важливіша за будь-яку сварку",
    "Мені шкода, що зробив тобі боляче",
    "Ми команда, навіть коли сваримось",
    "Жодна сварка не сильніша за моє кохання",
    "Давай помиримось? Я дуже сумую",
    "Я чую тебе і хочу, щоб тобі було добре",
    "Ти важливіша, ніж бути правим",
    "Після сварки я кохаю тебе не менше",
    "Хочу все виправити. Разом",
    "Обійми все вирішать. Чекаю на них",
    "Я поруч, навіть коли нам складно"
  ];

  const env = document.getElementById("env");
  const note = document.getElementById("note");
  const stage = document.getElementById("stage");
  const again = document.getElementById("again");
  let current = null;

  function pick() {
    let last = null;
    try { last = localStorage.getItem("lastPhrase"); } catch (e) {}
    const fromSorry = last === null || Math.random() < .4;
    const pool = (fromSorry ? SORRY : PHRASES).filter(p => p !== last && p !== current);
    const p = pool[Math.floor(Math.random() * pool.length)];
    try { localStorage.setItem("lastPhrase", p); } catch (e) {}
    current = p;
    return p;
  }

  // handwriting: letters are revealed in order, a pen nib follows them
  const PEN = '<svg viewBox="0 0 30 30" aria-hidden="true"><path d="M3 27 L7 18 L22 3 L27 8 L12 23 Z" fill="#f4ead9" stroke="#5a1f2b" stroke-width="1.4" stroke-linejoin="round"/><path d="M3 27 L7 18 L12 23 Z" fill="#3d0f19"/><path d="M19 6 L24 11" stroke="#5a1f2b" stroke-width="1.2"/></svg>';
  let penTimers = [], plan = [];
  function render(text) {
    penTimers.forEach(clearTimeout); penTimers = [];
    stage.classList.remove("written");
    note.innerHTML = "";
    const box = document.createElement("div");
    const p = document.createElement("p");
    box.append(p);
    note.append(box);
    const chars = [];
    text.split(" ").forEach(word => {
      const w = document.createElement("span");
      w.className = "w";
      for (const ch of word) {
        const c = document.createElement("span");
        c.className = "c";
        c.textContent = ch;
        w.append(c); chars.push(c);
      }
      p.append(w, " ");
    });
    const pen = document.createElement("span");
    pen.className = "pen"; pen.innerHTML = PEN;
    p.append(pen);
    const doodle = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    doodle.setAttribute("viewBox", "0 0 34 30");
    doodle.setAttribute("class", "doodle");
    doodle.innerHTML = '<path pathLength="100" d="M17 27 C 6 19, 1 12, 5 6 C 9 1, 15 3, 17 9 C 19 3, 25 1, 29 6 C 33 12, 28 19, 17 27 Z"/>';
    box.append(doodle);

    // timing plan: speed in px/s, pauses between words and lines
    plan = []; let t = 1.25, prevTop = null, prevRight = null;
    chars.forEach(c => {
      const x = c.offsetLeft, y = c.offsetTop + c.offsetHeight * .82, w = c.offsetWidth;
      if (prevTop !== null && c.offsetTop !== prevTop) t += .22;          // new line: pen lifts
      else if (prevRight !== null && x - prevRight > 2) t += .07;          // space between words
      const d = Math.max(.05, w / 150);
      c.style.setProperty("--d", d + "s");
      c.style.animationDelay = t + "s, " + t + "s";
      plan.push({ t, d, x, y, w });
      t += d; prevTop = c.offsetTop; prevRight = x + w;
    });
    plan.end = t;
    return pen;
  }
  function writeOut(pen) {
    if (reduce) { stage.classList.add("written"); return; }
    plan.forEach((s, i) => {
      penTimers.push(setTimeout(() => {
        pen.style.setProperty("--pd", "0s");
        pen.style.left = s.x + "px"; pen.style.top = s.y + "px";
        pen.classList.add("on");
        requestAnimationFrame(() => {
          pen.style.setProperty("--pd", s.d + "s");
          pen.style.left = (s.x + s.w) + "px";
        });
      }, s.t * 1000));
    });
    penTimers.push(setTimeout(() => { pen.classList.remove("on"); stage.classList.add("written"); }, plan.end * 1000 + 150));
  }

  /* ---------- particles ---------- */
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const cv = document.getElementById("fx");
  const ctx = cv.getContext("2d");
  const flash = document.getElementById("flash");
  const PETALS = ["#e3b3b6", "#d39aa2", "#c4808b", "#edc9c6", "#b56b78"];
  const HEARTS = ["#6e1a26", "#9b2c3c", "#c94f63", "#e48a98"];
  let W = 0, H = 0, parts = [], running = false;

  function size() {
    const d = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * d; cv.height = H * d;
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  addEventListener("resize", size);
  size();

  const rnd = (a, b) => a + Math.random() * (b - a);
  const pickOf = a => a[Math.floor(Math.random() * a.length)];

  function petal(x, y, burst) {
    const a = rnd(0, Math.PI * 2), sp = burst ? rnd(3, 9) : 0;
    return {
      kind: "petal", x, y,
      vx: burst ? Math.cos(a) * sp : rnd(-.3, .3),
      vy: burst ? Math.sin(a) * sp - 3 : rnd(.4, 1),
      g: burst ? .14 : 0, drag: burst ? .975 : 1,
      r: rnd(0, 6.28), vr: rnd(-.05, .05),
      s: rnd(6, 11), sway: rnd(0, 6.28),
      col: pickOf(PETALS), life: burst ? rnd(110, 170) : Infinity, age: 0, ambient: !burst
    };
  }
  function heart(x, y, burst) {
    const a = rnd(0, Math.PI * 2), sp = rnd(2, 7);
    return {
      kind: "heart", x, y,
      vx: burst ? Math.cos(a) * sp : rnd(-.4, .4),
      vy: burst ? Math.sin(a) * sp - 4 : rnd(-1.6, -.8),
      g: burst ? .12 : -.004, drag: burst ? .97 : 1,
      r: rnd(-.4, .4), vr: rnd(-.02, .02),
      s: burst ? rnd(8, 16) : rnd(10, 20), sway: rnd(0, 6.28),
      col: pickOf(HEARTS), life: burst ? rnd(90, 140) : rnd(200, 300), age: 0
    };
  }

  function drawHeart(s) {
    ctx.beginPath();
    ctx.moveTo(0, -s * .2);
    ctx.bezierCurveTo(0, -s * .45, -s * .5, -s * .45, -s * .5, -s * .2);
    ctx.bezierCurveTo(-s * .5, s * .05, 0, s * .2, 0, s * .45);
    ctx.bezierCurveTo(0, s * .2, s * .5, s * .05, s * .5, -s * .2);
    ctx.bezierCurveTo(s * .5, -s * .45, 0, -s * .45, 0, -s * .2);
    ctx.fill();
  }

  function frame() {
    ctx.clearRect(0, 0, W, H);
    parts = parts.filter(p => p.age < p.life && p.y < H + 40 && p.y > -60);
    for (const p of parts) {
      p.age++;
      p.vx *= p.drag; p.vy = p.vy * p.drag + p.g;
      p.sway += .03;
      p.x += p.vx + Math.sin(p.sway) * (p.ambient ? .6 : .3);
      p.y += p.vy;
      p.r += p.vr;
      const fade = p.life === Infinity ? 1 : Math.min(1, (p.life - p.age) / 40);
      ctx.save();
      ctx.globalAlpha = (p.ambient ? .75 : .95) * fade;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.r);
      ctx.fillStyle = p.col;
      if (p.kind === "heart") drawHeart(p.s);
      else {
        ctx.scale(1, .55 + .35 * Math.sin(p.sway * 2)); // flutter
        ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * .7, 0, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
    // keep a gentle petal fall in the background
    const amb = parts.filter(p => p.ambient).length;
    if (amb < Math.round(W / 40) && Math.random() < .05) parts.push(petal(rnd(0, W), -20, false));
    requestAnimationFrame(frame);
  }
  if (!reduce) { running = true; requestAnimationFrame(frame); }

  function burstAt(x, y) {
    if (!running) return;
    for (let i = 0; i < 34; i++) parts.push(petal(x, y, true));
    for (let i = 0; i < 22; i++) parts.push(heart(x, y, true));
  }
  function floatHearts(rect) {
    if (!running) return;
    let k = 0;
    const t = setInterval(() => {
      const side = Math.random() < .5;
      const x = side ? rnd(0, Math.max(30, rect.left + rect.width * .12)) : rnd(Math.min(W - 30, rect.right - rect.width * .12), W);
      parts.push(heart(x, rect.top + rect.height * rnd(.55, .85), false));
      if (++k > 26) clearInterval(t);
    }, 170);
  }

  /* ---------- music: starts on the first tap, fades in ---------- */
  const music = document.getElementById("music");
  const sound = document.getElementById("sound");
  let musicOn = true, fadeT = null;
  function fadeTo(target, ms) {
    clearInterval(fadeT);
    const step = 50, from = music.volume, n = ms / step; let i = 0;
    fadeT = setInterval(() => {
      i++; music.volume = Math.max(0, Math.min(1, from + (target - from) * i / n));
      if (i >= n) { clearInterval(fadeT); if (target === 0) music.pause(); }
    }, step);
  }
  function startMusic() {
    if (!musicOn || !music.paused) return;
    music.volume = 0;
    const p = music.play();
    if (p && p.then) p.then(() => fadeTo(.75, 2500)).catch(() => {});
    else fadeTo(.75, 2500);
  }
  sound.addEventListener("click", () => {
    musicOn = !musicOn;
    sound.classList.toggle("off", !musicOn);
    sound.setAttribute("aria-label", musicOn ? "Вимкнути музику" : "Увімкнути музику");
    if (musicOn) startMusic(); else fadeTo(0, 600);
  });

  function open() {
    if (env.classList.contains("is-open")) return;
    startMusic();
    sound.classList.add("show");
    const pen = render(pick());
    env.classList.add("shake");
    try { navigator.vibrate && navigator.vibrate([25, 60, 40]); } catch (e) {}
    setTimeout(() => {
      const r = env.getBoundingClientRect();
      const sx = r.left + r.width * .5, sy = r.top + r.height * .575;
      flash.style.setProperty("--fx-x", sx + "px");
      flash.style.setProperty("--fx-y", sy + "px");
      flash.classList.remove("go"); void flash.offsetWidth; flash.classList.add("go");
      burstAt(sx, sy);
      env.classList.remove("shake");
      env.classList.add("is-open");
      stage.classList.add("opened");
      writeOut(pen);
      env.setAttribute("aria-label", current);
      setTimeout(() => floatHearts(env.getBoundingClientRect()), 1600);
    }, 380);
  }

  env.addEventListener("click", open);

  // after opening: every tap on the page releases a few hearts
  document.addEventListener("pointerdown", e => {
    if (!running || !env.classList.contains("is-open") || e.target.closest(".again, .sound")) return;
    for (let i = 0; i < 9; i++) {
      const p = heart(e.clientX, e.clientY, true);
      p.vx *= .55; p.vy = p.vy * .55 - 1.5; p.s *= .8;
      parts.push(p);
    }
  });
  again.addEventListener("click", () => {
    penTimers.forEach(clearTimeout);
    env.classList.remove("is-open");
    stage.classList.remove("opened", "written");
    env.setAttribute("aria-label", "Відкрий мене");
    setTimeout(open, 900);
  });

  const intro = document.getElementById("intro");
  let introDone = false;
  function endIntro() {
    if (introDone) return; introDone = true;
    intro.classList.add("out");
    stage.classList.add("enter");
    try { sessionStorage.setItem("introSeen", "1"); } catch (e) {}
  }
  intro.addEventListener("click", endIntro);
  let seen = false;
  try { seen = sessionStorage.getItem("introSeen") === "1"; } catch (e) {}
  if (seen) { intro.remove(); stage.classList.add("enter"); introDone = true; }
  else {
    const imgs = [...document.querySelectorAll(".env img")].map(i => i.decode ? i.decode().catch(() => {}) : null);
    Promise.race([Promise.all(imgs), new Promise(r => setTimeout(r, 2500))]).then(() => {
      intro.classList.add("play");
      setTimeout(endIntro, reduce ? 4000 : 7600);
    });
  }
</script>

</body>
</html>
